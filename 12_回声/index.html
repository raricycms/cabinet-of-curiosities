<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>回声 · 奇珍室 N°12</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --ink-950:#080a0f; --ink-900:#0d1119; --ink-800:#141a24; --line:#2a3442;
    --paper:#efe8da; --text:#e6e2d8; --text-dim:#98a1ac;
    --cyan:#6fb3a8; --amber:#d9a05b; --verm:#c05b4d;
    --serif:"Noto Serif SC","Source Han Serif SC","STZhongsong","SimSun",serif;
    --sans:"Noto Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink-950)}
  body{min-height:100vh;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 600px at 50% -8%, rgba(217,160,91,.07), transparent 60%),
               radial-gradient(800px 600px at 20% 100%, rgba(111,179,168,.045), transparent 60%),
               var(--ink-950)}
  ::selection{background:rgba(217,160,91,.25);color:#fff}
  .wrap{max-width:900px;margin:0 auto;padding:0 clamp(20px,4vw,44px)}
  .top{display:flex;justify-content:space-between;align-items:baseline;padding:28px 0 16px;
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;
    letter-spacing:.18em;color:var(--text-dim)}
  .top a{color:var(--text-dim);text-decoration:none;transition:color .3s}
  .top a:hover{color:var(--amber)}

  .intro{padding:clamp(40px,7vh,66px) 0 clamp(22px,4vh,34px);text-align:center}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;color:var(--amber);
    display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
  .eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:var(--amber);opacity:.55}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(40px,6vw,62px);
    letter-spacing:.18em;margin:0 0 16px;color:var(--paper);text-indent:.18em}
  .lede{max-width:34em;margin:0 auto;font-size:14px;line-height:2;color:var(--text-dim)}
  .lede em{font-style:normal;color:#c9c3b6;border-bottom:1px solid rgba(217,160,91,.5)}

  .ask{display:flex;gap:10px;max-width:620px;margin:clamp(26px,4vh,40px) auto 0}
  .ask input{flex:1;min-width:0;background:rgba(20,26,36,.7);border:1px solid var(--line);
    color:var(--text);font-family:var(--serif);font-size:15px;letter-spacing:.04em;
    padding:15px 18px;border-radius:1px;outline:none;transition:border-color .3s}
  .ask input::placeholder{color:#69727d}
  .ask input:focus{border-color:rgba(217,160,91,.55)}
  .ask button{font-family:var(--sans);font-size:13px;letter-spacing:.2em;color:var(--paper);
    background:rgba(217,160,91,.12);border:1px solid rgba(217,160,91,.5);padding:0 24px;
    cursor:pointer;border-radius:1px;white-space:nowrap;transition:background .3s,border-color .3s}
  .ask button:hover{background:rgba(217,160,91,.24);border-color:var(--amber)}
  .ask button:active{transform:translateY(1px)}
  .hint{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    color:#6f7883;margin:12px 0 0;min-height:16px}

  /* 回声层 */
  .echoes{display:none;margin:clamp(28px,5vh,46px) auto 0;max-width:760px}
  .echoes.show{display:block}
  .row{display:grid;grid-template-columns:44px 1fr 48px;gap:14px;align-items:baseline;
    padding:9px 4px;border-bottom:1px solid rgba(42,52,66,.45);
    opacity:0;transform:translateY(-4px);animation:rise .5s var(--ease) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .row .idx{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#5f6873}
  .row .line{font-family:var(--serif);color:var(--paper);letter-spacing:.04em;
    line-height:1.75;word-break:break-word;transition:color .3s}
  .row .sim{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#5f6873;text-align:right}
  .row.zero .line{color:var(--paper)}
  .row.dead .line{color:#8a7f6d;text-decoration:line-through;text-decoration-color:rgba(192,91,77,.4)}
  .row:hover .line{color:#fff}

  .result-note{margin:clamp(26px,4vh,40px) auto 0;max-width:760px;text-align:center;
    font-family:var(--serif);font-size:15px;line-height:2.1;color:#c9c3b6;letter-spacing:.03em}
  .result-note b{color:var(--paper);font-weight:600}
  .stats{display:flex;gap:26px;justify-content:center;margin-top:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#6f7883}
  .stats b{color:var(--amber);font-weight:400}
  .acts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .acts button{font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--text-dim);
    background:none;border:1px solid var(--line);padding:10px 18px;cursor:pointer;border-radius:1px;
    transition:border-color .3s,color .3s}
  .acts button:hover{border-color:rgba(217,160,91,.55);color:var(--paper)}

  footer{margin-top:clamp(46px,8vh,80px);border-top:1px solid var(--line);padding:20px 0 50px;
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#5f6873;line-height:2.1}
  footer b{color:#8b949e;font-weight:400}

  @media (max-width:640px){
    .ask{flex-direction:column}
    .ask button{padding:13px 20px}
    .row{grid-template-columns:34px 1fr 42px;gap:10px;padding:8px 2px}
    .row .line{font-size:13.5px !important}
    .row .sim{font-size:8px}
  }
  @media (prefers-reduced-motion:reduce){
    .row{animation:none;opacity:1;transform:none}
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="../00_从这里开始.html">← 奇珍室</a>
    <span>N°12 / 回声</span>
  </header>

  <section class="intro">
    <div class="eyebrow">一件会变质的作品</div>
    <h1>回声</h1>
    <p class="lede">说一句话。它会被一遍一遍地传下去，<br>
      每一次都只差一点点。二十次之后，<em>它变成了另一句话</em>。<br>
      传话的人都没有说谎。</p>

    <form class="ask" id="form" autocomplete="off">
      <input id="say" type="text" maxlength="48" placeholder="随便说一句什么……" aria-label="你想说的话">
      <button type="submit">传 下 去</button>
    </form>
    <p class="hint" id="hint">回车开始 · 只在这台电脑里传，不联网</p>
  </section>

  <section class="echoes" id="echoes" aria-live="polite">
    <div id="rows"></div>
    <p class="result-note" id="note"></p>
    <div class="stats" id="stats"></div>
    <div class="acts">
      <button id="again">再传一次</button>
      <button id="copy">抄下这串回声</button>
    </div>
  </section>

  <footer>
    <div>回声不会说谎，它只是<b>记性不好</b>。<br>每一次转述，都是一次轻微的损耗。</div>
    <div style="text-align:right">奇珍室 · 创造 2026<br><b>N°12</b></div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var POOL = ["的","了","是","在","一","不","和","就","还","又","也","很"];
  var $ = function(id){ return document.getElementById(id); };
  var say = $('say'), form = $('form'), hint = $('hint');
  var echoes = $('echoes'), rows = $('rows'), note = $('note'), stats = $('stats');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = null;

  function mulberry32(a){
    a >>>= 0;
    return function(){
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), (t | 1)) >>> 0;
      t = (t ^ ((t + (Math.imul(t ^ (t >>> 7), (t | 61)) >>> 0)) >>> 0)) >>> 0;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function fnv1a(str){
    var h = 0x811C9DC5, b = new TextEncoder().encode(str);
    for(var i=0;i<b.length;i++){ h ^= b[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }

  // 一次传话：只用当前句子里已有的字，加上极少量的常用虚词
  function decay(text, rng, round){
    var originLen = Array.from(text).length;
    var best = text;
    for(var attempt=0; attempt<4; attempt++){
      var chars = Array.from(best);
      if(chars.length <= 1) return chars.join("");
      var ops = 1 + (round > 8 ? 1 : 0) + (round > 15 ? 1 : 0);
      var early = round <= 4;
      for(var k=0;k<ops;k++){
        if(chars.length <= 1) break;
        var p = rng();
        var i = Math.floor(rng() * chars.length);
        // 句子一旦比原句长，就强制丢字——传话总是越传越少
        if(chars.length > originLen) p = 0;
        if(early){
          // 前几次只是漏字、听错语序：像真的在传话
          if(p < 0.56){ chars.splice(i,1); }
          else if(p < 0.82 && chars.length > 2){
            var je = (i + 1) % chars.length;
            var te = chars[i]; chars[i] = chars[je]; chars[je] = te;
          } else {
            var j3 = Math.floor(rng()*chars.length);
            if(chars[j3] !== chars[i]) chars[i] = chars[j3];
          }
          continue;
        }
        if(p < 0.38){                          // 漏一个字
          chars.splice(i,1);
        } else if(p < 0.56 && chars.length > 2){ // 相邻换位（像听错了语序）
          var j = (i + 1) % chars.length;
          var t = chars[i]; chars[i] = chars[j]; chars[j] = t;
        } else if(p < 0.60){                   // 重复一个字
          chars.splice(i,0,chars[i]);
        } else if(p < 0.97){                   // 用本句里的另一个字替换
          var j2 = Math.floor(rng()*chars.length);
          if(chars[j2] !== chars[i]) chars[i] = chars[j2];
        } else {                               // 混进一个虚词
          chars.splice(i,0,POOL[Math.floor(rng()*POOL.length)]);
        }
      }
      var out = chars.join("");
      if(out !== best) return out;
      best = out;
    }
    return best;
  }

  function levenshtein(a, b){
    var m = a.length, n = b.length;
    if(!m) return n; if(!n) return m;
    var prev = new Array(n+1), cur = new Array(n+1);
    for(var j=0;j<=n;j++) prev[j]=j;
    for(var i=1;i<=m;i++){
      cur[0]=i;
      for(var k=1;k<=n;k++){
        cur[k] = Math.min(prev[k]+1, cur[k-1]+1, prev[k-1] + (a.charAt(i-1)===b.charAt(k-1)?0:1));
      }
      var tmp=prev; prev=cur; cur=tmp;
    }
    return prev[n];
  }

  function build(origin, seed){
    var rng = mulberry32(seed);
    var lines = [{ t: origin, d: 0, sim: 1 }];
    var cur = origin, collapsed = false;
    for(var r=1; r<=20; r++){
      cur = decay(cur, rng, r);
      var d = levenshtein(origin, cur);
      var sim = Math.max(0, 1 - d / Math.max(origin.length, cur.length, 1));
      lines.push({ t: cur, d: d, sim: sim });
      // 传到一个字都不剩几颗时，就停在这里
      if(Array.from(cur).length <= 2 && r >= 10){ collapsed = true; break; }
    }
    return { lines: lines, collapsed: collapsed };
  }

  function transcript(lines){
    return lines.map(function(l,i){
      return (i===0?'原句  ':'第'+i+'次 ') + l.t;
    }).join("\n");
  }

  function run(text, seed){
    last = { text: text, seed: seed, lines: null };
    var built = build(text, seed);
    var lines = built.lines;
    last.lines = lines;
    rows.innerHTML = '';
    note.textContent = '';
    stats.textContent = '';

    var delay = reduce ? 0 : 55;
    lines.forEach(function(l, i){
      var row = document.createElement('div');
      row.className = 'row' + (i===0?' zero':'') + (l.t.length<=1?' dead':'');
      var size = i===0 ? 19 : Math.max(11.5, 18 - i*0.34);
      row.innerHTML = '<span class="idx">' + (i===0 ? '原句' : ('#' + i)) + '</span>' +
                      '<span class="line" style="font-size:' + size + 'px;opacity:' + (i===0?1:Math.max(.28, 1 - i*0.035)).toFixed(3) + '"></span>' +
                      '<span class="sim">' + (i===0 ? '100%' : Math.round(l.sim*100) + '%') + '</span>';
      row.querySelector('.line').textContent = l.t || '（什么也没剩下）';
      rows.appendChild(row);
      if(!reduce){
        row.style.animationDelay = (i*delay) + 'ms';
        row.style.opacity = 0;
      } else {
        row.style.opacity = 1;
      }
    });

    var finalLine = lines[lines.length-1];
    var end = finalLine.t || '（什么也没剩下）';
    var times = lines.length - 1;
    note.innerHTML = built.collapsed
      ? '传到第 <b>' + times + '</b> 次，就没有人记得原句了。最后剩下 <b>「' + escapeHtml(end) + '」</b>。'
      : '<b>' + times + '</b> 次传下去，它成了 <b>「' + escapeHtml(end) + '」</b>。';
    stats.innerHTML = '<span>原句 <b>' + Array.from(text).length + '</b> 字</span>' +
                      '<span>传了 <b>' + times + '</b> 次</span>' +
                      '<span>最后剩 <b>' + Array.from(finalLine.t).length + '</b> 字</span>' +
                      '<span>编辑距离 <b>' + finalLine.d + '</b></span>' +
                      '<span>种子 <b>' + seed.toString(16).toUpperCase().padStart(8,'0') + '</b></span>';
    echoes.classList.add('show');
    if(!reduce){ try{ echoes.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){} }
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var t = say.value.trim();
    if(!t){
      hint.textContent = '先随便说一句什么——越日常越好。';
      say.focus();
      return;
    }
    hint.textContent = '同一句话，每次传下去的结果都不同。';
    run(t, (fnv1a(t + '|' + Date.now()) >>> 0));
  });

  $('again').addEventListener('click', function(){
    if(!last) return;
    run(last.text, (fnv1a(last.text + '|' + Date.now()) >>> 0));
  });

  $('copy').addEventListener('click', function(){
    if(!last || !last.lines) return;
    var text = transcript(last.lines);
    var done = function(){ hint.textContent = '已抄下这一串回声。'; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text); done(); });
    } else { fallback(text); done(); }
  });
  function fallback(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
  }

  // 预填一句，作为邀请
  say.value = '今天下雨了，我忘了带伞。';

  // 支持 ?t= 预填
  try{
    var q = new URLSearchParams(location.search).get('t');
    if(q) say.value = q.slice(0,48);
  }catch(e){}
})();
</script>
</body>
</html>
