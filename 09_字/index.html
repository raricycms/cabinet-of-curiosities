<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字 · N°09 — 奇珍室</title>
<style>
  :root{
    --ink-950:#080a0f; --ink-900:#0d1119; --ink-800:#141a24; --ink-700:#1e2633;
    --line:#2a3442; --paper:#efe8da; --text:#e6e2d8; --text-dim:#98a1ac;
    --verm:#c05b4d; --amber:#d9a05b;
    --serif:"Noto Serif SC","Source Han Serif SC","STZhongsong","SimSun",serif;
    --sans:"Noto Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink-950); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 24px}

  .top{display:flex;align-items:baseline;justify-content:space-between;
       padding:28px 0 18px;border-bottom:1px solid var(--line)}
  .back{font-size:13px;letter-spacing:.14em;color:var(--text-dim);
        transition:color .25s var(--ease)}
  .back:hover{color:var(--paper)}
  .plate{font-family:var(--mono);font-size:12px;letter-spacing:.26em;color:var(--verm)}

  .intro{padding:64px 0 48px;max-width:760px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.32em;
           color:var(--text-dim);margin:0 0 22px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6vw,58px);
     line-height:1.15;margin:0 0 20px;letter-spacing:.14em;color:var(--paper)}
  .lede{font-size:15px;line-height:1.95;color:var(--text-dim);margin:0;max-width:620px}
  .lede em{font-style:normal;color:var(--verm)}

  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:36px;
           padding:8px 0 72px}
  .card{margin:0;display:flex;flex-direction:column}
  .frame{position:relative;display:block;border:1px solid var(--line);
         background:var(--ink-900);overflow:hidden;
         transition:border-color .35s var(--ease),transform .35s var(--ease)}
  .frame img{display:block;width:100%;height:auto}
  .frame::after{content:"";position:absolute;inset:0;pointer-events:none;
                box-shadow:inset 0 0 0 1px rgba(239,232,218,.04)}
  .frame:hover,.frame:focus-visible{border-color:var(--verm);transform:translateY(-3px)}
  .frame:focus-visible{outline:1px solid var(--verm);outline-offset:4px}
  figcaption{padding:16px 2px 0}
  .no{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;
      color:var(--verm);margin-bottom:8px}
  .name{display:block;font-family:var(--serif);font-size:19px;letter-spacing:.1em;
        color:var(--paper);margin-bottom:7px}
  .desc{display:block;font-size:12.5px;line-height:1.8;color:var(--text-dim)}

  .note{border-top:1px solid var(--line);padding:26px 0 40px;
        display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;
        font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--text-dim)}
  .note b{font-weight:400;color:var(--text)}

  footer{margin-top:auto;border-top:1px solid var(--line)}
  .foot{display:flex;justify-content:space-between;align-items:center;
        padding:22px 0 26px;font-size:11px;letter-spacing:.18em;color:var(--text-dim)}
  .foot .num{font-family:var(--mono);letter-spacing:.22em;color:var(--paper)}

  .lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
      justify-content:center;flex-direction:column;gap:18px;
      background:rgba(8,10,15,.97);padding:24px;cursor:zoom-out}
  .lb[hidden]{display:none}
  .lb img{max-width:min(92vw,900px);max-height:82vh;width:auto;height:auto;
          border:1px solid var(--line);object-fit:contain}
  .lb p{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
        color:var(--text-dim);text-align:center}

  @media (max-width:900px){
    .gallery{grid-template-columns:1fr;gap:40px}
    .intro{padding:44px 0 34px}
    .top{padding:22px 0 14px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="back" href="../00_从这里开始.html">← 奇珍室</a>
    <span class="plate">N°09 / PLATES 01–02</span>
  </header>

  <section class="intro">
    <p class="eyebrow">TYPE FOUNDRY · 双联</p>
    <h1>字</h1>
    <p class="lede">两个字，两种材料。<em>「创」</em>被拆成粒子，在字内最密、向外逸散；
      <em>「造」</em>被压成一座岛，再用等高线切开。同一个字，既是笔画，也是地形。</p>
  </section>

  <section class="gallery">
    <figure class="card">
      <a class="frame" href="poster_01_创.jpg" data-cap="PLATE I · 创 · chuàng · 六画">
        <img src="poster_01_创.jpg" alt="「创」字由约 46 万颗粒子构成，字内密度高，字外逸散成星尘">
      </a>
      <figcaption>
        <span class="no">PLATE I</span>
        <span class="name">创 · chuàng · 六画</span>
        <span class="desc">字形蒙版当作密度场：笔画内部撒得最密，越往外越稀。
          1400 px 高的字，缩小时它退回成一个字，放大时是一团星尘。</span>
      </figcaption>
    </figure>

    <figure class="card">
      <a class="frame" href="poster_02_造.jpg" data-cap="PLATE II · 造 · zào · 十画">
        <img src="poster_02_造.jpg" alt="「造」字被模糊成高度场，再切成二十余级等高线，像一张地形图">
      </a>
      <figcaption>
        <span class="no">PLATE II</span>
        <span class="name">造 · zào · 十画</span>
        <span class="desc">字形先被高斯模糊成一座岛，再按等值线切成地形图。
          笔画越密的地方坡越陡，等高线也越挤；字的重心是这座山的最高点。</span>
      </figcaption>
    </figure>
  </section>

  <div class="note">
    <span>重跑：<b>python generate.py</b></span>
    <span>种子：<b>20261109</b></span>
    <span>尺寸：<b>2400 × 3600 px</b></span>
  </div>
</div>

<footer>
  <div class="wrap foot">
    <span>创造 · 2026</span>
    <span class="num">奇珍室 · N°09</span>
  </div>
</footer>

<div class="lb" id="lb" hidden>
  <img id="lbimg" alt="">
  <p id="lbcap"></p>
</div>

<script>
(function () {
  var lb = document.getElementById('lb');
  var img = document.getElementById('lbimg');
  var cap = document.getElementById('lbcap');

  function open(href, text) {
    img.src = href;
    img.alt = text || '';
    cap.textContent = text || '';
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function close() {
    lb.hidden = true;
    img.removeAttribute("src");
    document.body.style.overflow = '';
  }

  var links = document.querySelectorAll('a.frame');
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function (e) {
      e.preventDefault();
      open(this.getAttribute('href'), this.getAttribute('data-cap'));
    });
  }
  lb.addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !lb.hidden) { close(); }
  });
})();
</script>
</body>
</html>
