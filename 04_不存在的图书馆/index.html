<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>不存在的图书馆 · 奇珍室 N°04</title>
<style>
:root{
  --ink-950:#080a0f; --ink-900:#0d1119; --ink-800:#141a24; --ink-700:#1e2633;
  --line:#2a3442; --paper:#efe8da; --text:#e6e2d8; --text-dim:#98a1ac;
  --cyan:#6fb3a8; --amber:#d9a05b; --verm:#c05b4d; --lilac:#9a8fb8;
  --serif:"Noto Serif SC","Source Han Serif SC","STZhongsong","SimSun",serif;
  --sans:"Noto Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
  --kai:"KaiTi","STKaiti","Kaiti SC","FangSong",var(--serif);
  --ease:cubic-bezier(.2,.7,.2,1);
  --spine-h:142px;
  --paper-ink:#241d16; --paper-dim:#6f604e; --paper-line:rgba(120,96,70,.22);
  --stamp:#b0453a;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;overflow-x:hidden;
  background:
    radial-gradient(1100px 480px at 50% -6%, rgba(217,160,91,.06), transparent 62%),
    radial-gradient(900px 520px at 50% 108%, rgba(0,0,0,.55), transparent 62%),
    var(--ink-900);
}
body.locked{overflow:hidden}
::selection{background:rgba(217,160,91,.28);color:var(--paper)}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px clamp(16px,3vw,32px);
  background:linear-gradient(180deg,rgba(8,10,15,.97) 0%,rgba(8,10,15,.74) 64%,rgba(8,10,15,0) 100%);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}.back{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--text-dim);
  text-decoration:none;padding:7px 2px;transition:color .2s var(--ease);white-space:nowrap;
}
.back:hover{color:var(--amber)}
.brand{
  position:absolute;left:50%;transform:translateX(-50%);
  font-family:var(--serif);font-size:12.5px;letter-spacing:.3em;
  color:var(--text-dim);opacity:.62;white-space:nowrap;pointer-events:none;
}
.rebuild{
  margin-left:auto;flex:0 0 auto;
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--text);
  background:transparent;border:1px solid var(--line);border-radius:2px;
  padding:8px 14px;cursor:pointer;white-space:nowrap;
  transition:border-color .22s var(--ease),color .22s var(--ease),background .22s var(--ease);
}
.rebuild:hover{border-color:rgba(217,160,91,.5);color:var(--amber);background:rgba(217,160,91,.05)}
.rebuild:active{transform:translateY(1px)}
.rebuild .g{font-family:var(--mono);margin-right:7px;opacity:.75;font-size:13px}

/* ---------- 版心 ---------- */
.stage{
  position:relative;z-index:1;max-width:1200px;margin:0 auto;
  padding:8px clamp(16px,3.2vw,40px) 76px;
}
.intro{max-width:660px;margin:6px auto 16px;text-align:center}
.eyebrow{
  margin:0 0 9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
  color:var(--amber);opacity:.78;
}
h1{
  margin:0 0 9px;font-family:var(--serif);font-weight:600;
  font-size:clamp(26px,3.6vw,38px);letter-spacing:.07em;line-height:1.2;color:var(--paper);
}
.lede{margin:0;font-size:14.5px;line-height:1.8;color:var(--text-dim)}
.lede em{font-style:normal;color:var(--paper)}
.stats{
  margin:11px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
  color:var(--text-dim);opacity:.62;
}

/* ---------- 书架 ---------- */
.shelves{
  width:100%;max-width:770px;margin:0 auto;display:flex;flex-direction:column;gap:19px;
  transition:opacity .22s var(--ease);
}
.shelves.fade{opacity:.22}
.shelf{position:relative}
.shelf-head{
  display:flex;align-items:center;gap:11px;margin:0 3px 6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--text-dim);opacity:.5;
}
.shelf-head .rule{flex:1;height:1px;background:var(--line)}
.shelf-head .yr{letter-spacing:.14em}
.shelf-body{
  position:relative;overflow-x:auto;overflow-y:hidden;padding:0 14px;
  border:1px solid #1a1f27;border-bottom:0;border-radius:2px 2px 0 0;
  background:
    radial-gradient(150% 72% at 50% 116%, rgba(217,160,91,.10), transparent 62%),
    linear-gradient(180deg,#06070a 0%,#0a0b11 46%,#0b0a09 100%);
  box-shadow:inset 0 20px 32px -18px #000, inset 0 -8px 20px -10px rgba(0,0,0,.92);
  scrollbar-width:thin;scrollbar-color:rgba(217,160,91,.2) transparent;
}
.shelf-body::-webkit-scrollbar{height:5px}
.shelf-body::-webkit-scrollbar-track{background:transparent}
.shelf-body::-webkit-scrollbar-thumb{background:rgba(217,160,91,.2);border-radius:3px}
.spines{
  display:flex;align-items:flex-end;justify-content:center;gap:6px;
  box-sizing:content-box;height:var(--spine-h);padding:16px 6px 0;
}
.plank{
  height:13px;margin:0 -1px;border-top:1px solid #5b4027;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,#4a3521 0%,#2e2013 44%,#191109 100%);
  box-shadow:0 16px 26px -12px rgba(0,0,0,.95), inset 0 1px 0 rgba(217,160,91,.2);
}
.plank::after{content:"";display:block;height:1px;margin-top:2px;background:rgba(217,160,91,.1)}

/* 书脊 */
.spine{
  position:relative;flex:0 0 auto;width:var(--w,44px);
  height:calc(var(--hf,96) * var(--spine-h) / 100);
  padding:6px 0;border:0;border-radius:2px 2px 0 0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.46) 0%,rgba(0,0,0,.14) 5%,rgba(255,255,255,.075) 16%,
      rgba(255,255,255,.03) 32%,rgba(0,0,0,.02) 54%,rgba(0,0,0,.12) 82%,rgba(0,0,0,.44) 100%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,
      hsl(var(--sh) var(--ss) calc(var(--sl) + 8%)),
      hsl(var(--sh) var(--ss) var(--sl)) 56%,
      hsl(var(--sh) var(--ss) calc(var(--sl) - 7%)));
  color:rgba(239,232,218,var(--fg,.8));
  font-family:var(--serif);font-size:var(--fs,12px);letter-spacing:.08em;line-height:1;
  writing-mode:vertical-rl;text-orientation:upright;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.32),inset 1px 0 0 rgba(255,255,255,.06),
    inset -1px 0 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.55);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),color .2s var(--ease),filter .3s var(--ease);
}
.spine::before{
  content:"";position:absolute;left:0;right:0;top:8%;height:1px;
  background:var(--bandc,rgba(239,232,218,.26));
}
.spine::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.34));
}
.spine--absent::after{
  content:"";left:2px;right:2px;bottom:9%;height:2px;
  background:rgba(192,91,77,.5);box-shadow:0 0 8px rgba(192,91,77,.35);
}
.spine-t{max-height:100%;overflow:hidden}
.spine:hover,.spine:focus-visible{
  transform:translateY(-6px);z-index:6;outline:none;
  color:rgba(248,243,232,1);filter:brightness(1.07);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.12),0 10px 18px -8px rgba(0,0,0,.95),0 0 0 1px rgba(217,160,91,.24);
}
.spine.is-out{
  transform:translateY(-13px);color:rgba(248,243,232,1);
  box-shadow:0 16px 26px -12px rgba(0,0,0,.95),0 0 0 1px rgba(217,160,91,.38);
}
.spine.is-out::before{background:rgba(217,160,91,.5)}

.hint{
  margin:0 auto;text-align:center;min-width:0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--text-dim);opacity:.48;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hint .hx{opacity:.9}

/* ---------- 悬浮提示 ---------- */
.tip{
  position:fixed;left:0;top:0;z-index:70;pointer-events:none;max-width:300px;
  padding:9px 12px 10px;border:1px solid rgba(90,72,52,.45);border-radius:1px;
  background:linear-gradient(158deg,#f5f0e5 0%,#ebe3d3 100%);
  box-shadow:0 24px 40px -18px rgba(0,0,0,.95),0 2px 8px rgba(0,0,0,.5);
  color:#241d16;
  opacity:0;transform:translateY(5px);transition:opacity .16s var(--ease),transform .16s var(--ease);
}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.45;color:#1f1912}
.tip span{display:block;margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#7a6a56}
.tip i{display:block;margin-top:6px;padding-top:5px;border-top:1px solid rgba(120,96,70,.2);
  font-style:normal;font-size:10.5px;letter-spacing:.08em;color:#a8402f}

/* ---------- 卡片 ---------- */
.reader{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:clamp(0px,3vw,40px)}
.reader[hidden]{display:none}
.backdrop{
  position:absolute;inset:0;background:rgba(5,6,9,.76);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  opacity:0;transition:opacity .3s var(--ease);
}
.reader.open .backdrop{opacity:1}
.card{
  position:relative;width:min(680px,100%);max-height:min(86dvh,860px);overflow-y:auto;
  overscroll-behavior:contain;padding:clamp(22px,3.6vw,38px) clamp(20px,3.6vw,38px) clamp(24px,3vw,34px);
  border-radius:2px;color:var(--paper-ink);
  background:
    repeating-linear-gradient(0deg,rgba(120,96,70,.028) 0 1px,transparent 1px 3px),
    linear-gradient(158deg,#f5f0e5 0%,#ece5d6 52%,#e6ddcc 100%);
  box-shadow:0 44px 84px -32px rgba(0,0,0,.92),0 0 0 1px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.65);
  opacity:0;transform:translateY(12px) scale(.994);
  transition:opacity .28s var(--ease),transform .38s var(--ease);
  scrollbar-width:thin;scrollbar-color:rgba(120,96,70,.35) transparent;
}
.reader.open .card{opacity:1;transform:none}
.card:focus{outline:none}
.card::-webkit-scrollbar{width:8px}
.card::-webkit-scrollbar-thumb{background:rgba(120,96,70,.32);border-radius:4px}
.card-close{
  position:absolute;top:10px;right:10px;width:34px;height:34px;display:grid;place-items:center;
  border:0;background:transparent;cursor:pointer;border-radius:50%;
  font-family:var(--mono);font-size:18px;line-height:1;color:#8b7a64;
  transition:color .2s var(--ease),background .2s var(--ease);
}
.card-close:hover{color:var(--paper-ink);background:rgba(120,96,70,.12)}
.card-close:focus-visible{outline:1px solid var(--paper-ink);outline-offset:2px}

.c-top{
  display:flex;align-items:center;gap:9px;margin:0 34px 14px 0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#94826a;
}
.c-top .dot{width:3px;height:3px;border-radius:50%;background:#b8a68c;flex:0 0 auto}
.c-title{
  margin:0 0 8px;font-family:var(--serif);font-weight:600;
  font-size:clamp(23px,3.2vw,32px);line-height:1.34;letter-spacing:.025em;color:#201a13;
  word-break:break-word;
}
.c-author{margin:0;font-family:var(--serif);font-size:14.5px;letter-spacing:.03em;color:#5d5142}
.c-author .sep{margin:0 8px;color:#a3917145;color:#a39171}

.c-meta{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px 16px;
  margin:17px 0 0;padding:13px 0 14px;
  border-top:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);
}
.c-meta .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#9a876d}
.c-meta .v{margin-top:4px;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:#33291f;line-height:1.5}

.c-label{
  margin:20px 0 8px;font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:#8d7a62;
}
.c-blurb{margin:0;font-size:14.5px;line-height:1.95;color:#3a3028;letter-spacing:.01em}
.c-excerpt{
  margin:0;padding:1px 0 1px 16px;border-left:2px solid rgba(176,69,58,.4);
  font-family:var(--kai);font-size:17px;line-height:2.02;color:#2c241d;letter-spacing:.02em;
}

/* 借阅卡 */
.loan{
  position:relative;margin:22px 0 0;padding:14px 16px 18px;
  background:#f0e7d3;border:1px solid rgba(120,96,70,.32);
  box-shadow:inset 0 0 0 3px #f0e7d3,inset 0 0 0 4px rgba(120,96,70,.16);
}
.loan-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-right:78px;
  font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:#9a876d;margin-bottom:9px;
}
.loan-head .no{letter-spacing:.14em;opacity:.85}
.lrow,.lhead{display:grid;grid-template-columns:82px minmax(0,1fr) 82px 66px;align-items:center;height:25px}
.lhead{height:20px;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:#a89479}
.lrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:#4a3f31;
  border-bottom:1px solid rgba(176,69,58,.13);
}
.lrow:nth-child(odd){background:rgba(176,69,58,.028)}
.lrow .c2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.lrow .c3{color:#7c6b55}
.lrow .c4{font-size:10px;letter-spacing:.06em}
.st-ok{color:#4d6a54}
.st-late{color:#a8402f}
.st-out{color:#8a651f}
.stamp{
  position:absolute;right:14px;top:9px;transform:rotate(-7deg);
  padding:3px 9px 3px 11px;border:2px solid rgba(176,69,58,.5);border-radius:2px;
  box-shadow:inset 0 0 0 2px #f0e7d3,inset 0 0 0 3px rgba(176,69,58,.28);
  font-family:var(--serif);font-size:12px;letter-spacing:.24em;color:rgba(176,69,58,.66);
  pointer-events:none;mix-blend-mode:multiply;
}
.egg-note{
  margin:13px 0 0;padding-top:11px;border-top:1px dashed rgba(176,69,58,.26);
  font-family:var(--serif);font-size:13px;line-height:1.85;color:#7c5a4a;letter-spacing:.02em;
}
.c-actions{
  position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;
  margin:22px 0 0;padding:12px 0 8px;
  background:
    repeating-linear-gradient(0deg,rgba(120,96,70,.028) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#eee6d7 0%,#e7decc 100%);
  border-top:1px solid rgba(120,96,70,.14);
  box-shadow:0 -16px 20px -16px rgba(60,45,30,.4);
}
.btn{
  padding:10px 18px;border-radius:2px;cursor:pointer;border:1px solid transparent;
  font-family:var(--sans);font-size:13px;letter-spacing:.08em;
  transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:#241d16;color:#f3ede1;border-color:#241d16}
.btn-primary:hover{background:#3b2f23}
.btn-ghost{background:transparent;color:#6f604e;border-color:rgba(120,96,70,.38)}
.btn-ghost:hover{border-color:#241d16;color:#241d16}
.btn:focus-visible{outline:1px solid #241d16;outline-offset:2px}

/* ---------- 底栏 / 提示条 ---------- */
.botbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:9px clamp(16px,3vw,30px) 11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--text-dim);
  background:linear-gradient(180deg,rgba(8,10,15,0) 0%,rgba(8,10,15,.9) 46%,var(--ink-950) 100%);
}
.sound{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border:1px solid var(--line);border-radius:2px;background:transparent;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--text-dim);
  cursor:pointer;transition:color .2s,border-color .2s;
}
.sound:hover{color:var(--paper);border-color:#3a4658}
.sound[aria-pressed="true"]{color:var(--amber);border-color:rgba(217,160,91,.4)}
.seed{opacity:.55;white-space:nowrap}
.pageno{margin-left:auto;white-space:nowrap;letter-spacing:.16em;color:var(--text-dim);opacity:.8}
.pageno .n{color:var(--amber);opacity:.85}

.toast{
  position:fixed;left:50%;bottom:72px;z-index:120;transform:translate(-50%,10px);
  padding:10px 18px;border:1px solid #2c3644;border-radius:2px;background:#0c1017;
  font-size:12.5px;letter-spacing:.05em;color:var(--paper);opacity:0;pointer-events:none;
  box-shadow:0 22px 40px -22px #000;transition:opacity .24s var(--ease),transform .24s var(--ease);
  max-width:calc(100vw - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 响应式 ---------- */
@media (max-width:820px){
  .brand{display:none}
  .intro{margin-bottom:12px}
  .shelves{max-width:none}
  .spines{justify-content:flex-start}
}
@media (max-width:560px){
  :root{--spine-h:118px}
  .stage{padding-bottom:62px}
  .shelves{gap:15px}
  .lede{font-size:14px}
  .stats{font-size:10px;letter-spacing:.14em}
  .seed{display:none}
  .shelf-head{font-size:9px;letter-spacing:.16em}
  .hint{font-size:9px;letter-spacing:.1em}
  .hint .hx{display:none}
  .botbar{gap:10px}
  .pageno{font-size:9px;letter-spacing:.12em}
  .reader{padding:0}
  .card{width:100%;height:100%;max-height:100dvh;max-width:none;border-radius:0}
  .c-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lrow,.lhead{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d1 st" "c2 c3";height:auto;padding:6px 0;row-gap:2px}
  .lhead{display:none}
  .lrow .c1{grid-area:d1;font-size:10.5px}
  .lrow .c4{grid-area:st;justify-self:end}
  .lrow .c2{grid-area:c2;padding-right:0;color:#5d5142}
  .lrow .c3{grid-area:c3;justify-self:end;font-size:10px}
  .lrow .c3::before{content:"归还 ";opacity:.65}
  .c-excerpt{font-size:16px}
  .toast{bottom:64px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .spine:hover,.spine:focus-visible{transform:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="../00_从这里开始.html">← 奇珍室</a>
  <div class="brand">不存在的图书馆</div>
  <button class="rebuild" id="rebuildBtn" type="button"><span class="g">↻</span>重构图书馆</button>
</header>

<main class="stage">
  <section class="intro">
    <p class="eyebrow">奇珍室 · 展品 N°04</p>
    <h1>不存在的图书馆</h1>
    <p class="lede">这座图书馆只收藏<em>从未被写出的书</em>。抽出一本书脊，它会展开成一张卡片。</p>
    <p class="stats" id="stats">36 册　·　3 架</p>
  </section>

  <section class="shelves" id="shelves" aria-label="书架"></section>
</main>

<footer class="botbar">
  <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="开启声音">声 关</button>
  <span class="seed" id="seedline">SEED</span>
  <span class="hint">点击书脊抽出<span class="hx">　·　按 Esc 放回</span><span class="hx">　·　「重构图书馆」换一批</span></span>
  <span class="pageno"><span class="n">N°04</span> · 不存在的图书馆</span>
</footer>

<div class="reader" id="reader" hidden>
  <div class="backdrop" data-close></div>

  function hashSeed(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function makeRng(seedStr) {
    var a = hashSeed(String(seedStr))();
    function next() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    return {

    /* 分架 */
    var shelves = [], s, group;
    for (s = 0; s < Math.ceil(books.length / 12); s++) {
      group = books.slice(s * 12, s * 12 + 12);
      shelves.push({
        roman: roman[s] || String(s + 1),
        from: group[0] ? group[0].year : '',
        to: group[group.length - 1] ? group[group.length - 1].year : '',
        books: group
      });
    }

    var unreturned = 0;
    for (i = 0; i < books.length; i++) {
      if (books[i].loans[books[i].loans.length - 1].status === '仍在借阅中') unreturned++;
    }

    return { seed: String(seed), books: books, shelves: shelves, unreturned: unreturned };
  }

  return {
    make: makeLibrary,
    version: '1.0',
    cjkCount: cjkCount,
    _rng: makeRng
  };
})();
/* ==== LIBRARY-CONTENT-ENGINE :END ==== */
</script>

<script>
(function () {
  'use strict';

  var ENGINE = window.LibraryEngine;
  var shelfEl = document.getElementById('shelves');
  var statsEl = document.getElementById('stats');
  var seedEl = document.getElementById('seedline');
  var readerEl = document.getElementById('reader');
  var cardEl = document.getElementById('card');
  var tipEl = document.getElementById('tip');
  var toastEl = document.getElementById('toast');
  var announceEl = document.getElementById('announce');
  var rebuildBtn = document.getElementById('rebuildBtn');
  var soundBtn = document.getElementById('soundBtn');

  var state = { seed: '', books: [], shelves: [], current: null, busy: false, lastFocus: null };
  var toastTimer = null;

  /* ---------- 种子 ---------- */
  function newSeed() {
    var s = '';
    var chars = '0123456789ABCDEF';
    for (var i = 0; i < 6; i++) s += chars.charAt(Math.floor(Math.random() * 16));
    return s;
  }

  /* ---------- 渲染书架 ---------- */
  function render() {
    shelfEl.innerHTML = '';
    var frag = document.createDocumentFragment();

    state.shelves.forEach(function (sh) {
      var sec = document.createElement('section');
      sec.className = 'shelf';
      sec.setAttribute('aria-label', '架 ' + sh.roman);

      var head = document.createElement('div');
      head.className = 'shelf-head';
      var range = (sh.from === sh.to) ? String(sh.from) : (sh.from + '—' + sh.to);
      head.innerHTML = '<span>架 ' + sh.roman + '</span><span class="rule"></span><span class="yr">' + range + '</span>';

      var body = document.createElement('div');
      body.className = 'shelf-body';

      var spines = document.createElement('div');
      spines.className = 'spines';

      sh.books.forEach(function (b) {
        var st = b.style;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'spine' + (b.isEgg ? ' spine--absent' : '');
        btn.setAttribute('data-i', b.i);
        btn.setAttribute('aria-label', '《' + b.title + '》 ' + b.author.name + '，' + b.year + ' 年');
        btn.style.setProperty('--sh', st.sh);
        btn.style.setProperty('--ss', st.ss);
        btn.style.setProperty('--sl', st.sl);
        btn.style.setProperty('--w', st.w + 'px');
        btn.style.setProperty('--hf', st.hf);
        btn.style.setProperty('--fs', st.fs + 'px');
        btn.style.setProperty('--fg', st.fg);
        btn.style.setProperty('--bandc', st.bandc);
        var span = document.createElement('span');
        span.className = 'spine-t';
        span.textContent = b.title;
        btn.appendChild(span);
        spines.appendChild(btn);
      });

      body.appendChild(spines);
      var plank = document.createElement('div');
      plank.className = 'plank';

      sec.appendChild(head);
      sec.appendChild(body);
      sec.appendChild(plank);
      frag.appendChild(sec);
    });

    shelfEl.appendChild(frag);

    var books = state.books;
    statsEl.textContent = books.length + ' 册　·　' + state.shelves.length + ' 架　·　' +
      (state.unreturned || 0) + ' 册未归';
    seedEl.textContent = 'SEED ' + state.seed;
  }

  function build(seed) {
    var lib = ENGINE.make(seed, 36);
    state.seed = lib.seed;
    state.books = lib.books;
    state.shelves = lib.shelves;
    state.unreturned = lib.unreturned;
    state.current = null;
    render();
  }

  /* ---------- 提示条 ---------- */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  function announce(msg) {
    announceEl.textContent = msg;
  }

  /* ---------- 悬浮提示 ---------- */
  function showTip(spine) {
    if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
    var b = state.books[Number(spine.getAttribute('data-i'))];
    if (!b) return;
    tipEl.querySelector('b').textContent = '《' + b.title + '》';
    tipEl.querySelector('span').textContent = b.author.name + '　·　' + b.year + '　·　' + b.style.era;
    tipEl.querySelector('i').textContent = '点击抽出';
    tipEl.classList.add('show');
    positionTip(spine);
  }

  function positionTip(spine) {
    var r = spine.getBoundingClientRect();
    var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    var left = r.left + r.width / 2 - tw / 2;
    left = Math.max(10, Math.min(left, window.innerWidth - tw - 10));
    var top = r.top - th - 10;
    if (top < 56) top = r.bottom + 12;
    tipEl.style.left = Math.round(left) + 'px';
    tipEl.style.top = Math.round(top) + 'px';
  }

  function hideTip() { tipEl.classList.remove('show'); }

  /* ---------- 卡片 ---------- */
  function loanRow(row) {
    var cls = row.status === '已还' ? 'st-ok' : (row.status === '逾期' ? 'st-late' : 'st-out');
    return '<div class="lrow">' +
      '<span class="c1">' + row.out + '</span>' +
      '<span class="c2">' + row.who + '</span>' +
      '<span class="c3">' + (row.back || '—') + '</span>' +
      '<span class="c4 ' + cls + '">' + row.status + '</span>' +
      '</div>';
  }

  function fillCard(b) {
    var stampText = '已归架', stampClass = '';
    var last = b.loans[b.loans.length - 1];
    if (last.status === '逾期') stampText = '逾期';
    if (last.status === '仍在借阅中') { stampText = '未归还'; stampClass = ' stamp-out'; }

    var html = '' +
      '<button class="card-close" type="button" data-close aria-label="放回架上">×</button>' +
      '<div class="c-top"><span>馆藏 ' + b.id + '</span><span class="dot"></span>' +
      '<span>借阅 ' + b.loans.length + ' 次</span><span class="dot"></span>' +
      '<span>' + b.style.era + '</span></div>' +
      '<h2 class="c-title">《' + b.title + '》</h2>' +
      '<p class="c-author">' + b.author.name +
      '<span class="sep">·</span>' + b.author.life +
      '<span class="sep">·</span>' + b.author.nation + '</p>' +
      '<div class="c-meta">' +
      '<div><div class="k">成书</div><div class="v">' + b.year + '</div></div>' +
      '<div><div class="k">出版者</div><div class="v">' + b.press + '</div></div>' +
      '<div><div class="k">篇幅</div><div class="v">' + b.pages + ' 页 · ' + b.size + '</div></div>' +
      '<div><div class="k">国籍</div><div class="v">' + b.author.nation + '</div></div>' +
      '</div>' +
      '<p class="c-label">内容简介</p>' +
      '<p class="c-blurb">' + b.blurb + '</p>' +
      '<p class="c-label">原文摘录</p>' +
      '<blockquote class="c-excerpt">' + b.excerpt + '</blockquote>' +
      '<div class="loan">' +
      '<div class="loan-head"><span>借 阅 卡</span><span class="no">CARD / ' + b.id + '</span></div>' +
      '<div class="lhead"><span>借出</span><span>借阅人</span><span>归还</span><span>状态</span></div>' +
      b.loans.map(loanRow).join('') +
      '<div class="stamp' + stampClass + '">' + stampText + '</div>' +
      (b.isEgg ? '<p class="egg-note">馆员注：这本书从未回到架上。我们保留了它的位置。</p>' : '') +
      '</div>' +
      '<div class="c-actions">' +
      '<button class="btn btn-primary" type="button" id="copyBtn">借走这本</button>' +
      '<button class="btn btn-ghost" type="button" data-close>放回架上</button>' +
      '</div>';

    cardEl.innerHTML = html;
    cardEl.setAttribute('aria-label', '《' + b.title + '》');
  }

  function openBook(i) {
    var b = state.books[i];
    if (!b) return;
    var prev = shelfEl.querySelector('.spine.is-out');
    if (prev) prev.classList.remove('is-out');
    var spine = shelfEl.querySelector('.spine[data-i="' + i + '"]');
    if (spine) spine.classList.add('is-out');

    state.current = b;
    state.lastFocus = spine || null;
    hideTip();
    fillCard(b);
    readerEl.hidden = false;
    void readerEl.offsetWidth;
    readerEl.classList.add('open');
    document.body.classList.add('locked');
    var closeBtn = cardEl.querySelector('.card-close');
    if (closeBtn) closeBtn.setAttribute('tabindex', '-1');
    cardEl.focus({ preventScroll: true });
    cardEl.scrollTop = 0;
    playRustle();
    announce('已抽出《' + b.title + '》');
  }

  function closeReader() {
    if (readerEl.hidden) return;
    readerEl.classList.remove('open');
    document.body.classList.remove('locked');
    var prev = shelfEl.querySelector('.spine.is-out');
    if (prev) prev.classList.remove('is-out');
    var focusBack = state.lastFocus;
    state.current = null;
    setTimeout(function () {
      readerEl.hidden = true;
      cardEl.innerHTML = '';
      if (focusBack && document.contains(focusBack)) focusBack.focus({ preventScroll: true });
    }, 240);
  }

  /* ---------- 复制 ---------- */
  function copyBook(b) {
    var text = '《' + b.title + '》\n' +
      b.author.name + ' · ' + b.author.life + ' · ' + b.author.nation + '\n' +
      b.year + ' · ' + b.press + '\n\n' + b.excerpt;
    var ok = false;
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0';
    document.body.appendChild(ta);
    try {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
    } catch (err) { ok = false; }
    document.body.removeChild(ta);
    if (ok) {
      toast('已借走 · 书名、作者、摘录已复制');
      announce('已复制到剪贴板');
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('已借走 · 书名、作者、摘录已复制');
      }, function () {
        toast('复制失败，请手动选择文字');
      });
    } else {
      toast('复制失败，请手动选择文字');
    }
    cardEl.focus({ preventScroll: true });
  }

  /* ---------- 声音（默认静音） ---------- */
  var audio = { ctx: null, on: false, noise: null };
  function ensureCtx() {
    if (!audio.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio.ctx = new AC();
    }
    if (audio.ctx.state === 'suspended' && audio.ctx.resume) audio.ctx.resume();
    return audio.ctx;
  }
  function noiseBuffer(ctx) {
    if (audio.noise) return audio.noise;
    var len = Math.floor(ctx.sampleRate * 0.3);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    audio.noise = buf;
    return buf;
  }
  function playRustle() {
    if (!audio.on) return;
    try {
      var ctx = ensureCtx();
      if (!ctx) return;
      var src = ctx.createBufferSource();
      src.buffer = noiseBuffer(ctx);
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1900;
      bp.Q.value = 0.9;
      var gain = ctx.createGain();
      var t = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.07, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      src.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.32);
    } catch (err) { /* 静默失败 */ }
  }

  function setSound(on) {
    audio.on = on;
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundBtn.textContent = on ? '声 开' : '声 关';
    soundBtn.setAttribute('aria-label', on ? '关闭声音' : '开启声音');
    if (on) {
      ensureCtx();
      playRustle();
      toast('已开启声音 · 翻页声很轻');
    }
  }

  /* ---------- 事件 ---------- */
  shelfEl.addEventListener('click', function (e) {
    var spine = e.target.closest('.spine');
    if (!spine) return;
    openBook(Number(spine.getAttribute('data-i')));
  });

  shelfEl.addEventListener('mouseover', function (e) {
    var spine = e.target.closest('.spine');
    if (spine) showTip(spine);
  });

  shelfEl.addEventListener('mouseleave', hideTip);

  shelfEl.addEventListener('focusin', function (e) {
    var spine = e.target.closest('.spine');
    if (spine) showTip(spine);
  });
  shelfEl.addEventListener('focusout', hideTip);

  window.addEventListener('scroll', hideTip, { passive: true });
  window.addEventListener('resize', hideTip);

  readerEl.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeReader(); return; }
    if (e.target.closest('#copyBtn')) {
      if (state.current) copyBook(state.current);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (!readerEl.hidden) { e.preventDefault(); closeReader(); }
    }
  });

  rebuildBtn.addEventListener('click', function () {
    if (state.busy) return;
    state.busy = true;
    if (!readerEl.hidden) closeReader();
    hideTip();
    shelfEl.classList.add('fade');
    setTimeout(function () {
      var seed;
      do { seed = newSeed(); } while (seed === state.seed);
      build(seed);
      shelfEl.classList.remove('fade');
      state.busy = false;
      toast('已重构 · 换了一批从未被写出的书');
    }, 220);
  });

  soundBtn.addEventListener('click', function () { setSound(!audio.on); });

  /* ---------- 启动 ---------- */
  build(newSeed());
})();
</script>
</body>
</html>
